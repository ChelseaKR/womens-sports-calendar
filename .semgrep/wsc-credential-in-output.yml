# Repository-specific Semgrep rule (SECURITY-AND-SUPPLY-CHAIN-STANDARD §3,
# OBSERVABILITY-STANDARD §3 OBS-11): a credential-named value must never reach
# printed, logged or raised output. The Ticketmaster key travels in a request
# query string, so an error message is the likeliest place for it to leak.
# Rule tests: .semgrep/wsc-credential-in-output.py (`semgrep scan --test .semgrep`).
rules:
  - id: wsc-credential-in-output
    message: >-
      A credential-named value ($X) reaches printed, logged or raised output.
      Redact it first; never write a credential to a log (OBS-11).
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: print(..., <... $X ...>, ...)
          - pattern: $STREAM.write(..., <... $X ...>, ...)
          - pattern: raise $EXC(..., <... $X ...>, ...)
          - patterns:
              - pattern: $LOGGER.$METHOD(..., <... $X ...>, ...)
              - metavariable-regex:
                  metavariable: $METHOD
                  regex: ^(debug|info|warning|warn|error|exception|critical|fatal|log)$
      - metavariable-regex:
          metavariable: $X
          regex: (?i)^(\w+\.)*_?\w*(api_?key|apikey|secret|password|passwd|credential|token)s?$
