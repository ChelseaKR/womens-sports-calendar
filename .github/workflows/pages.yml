# Nightly build + deploy to GitHub Pages.
#
# The pipeline (pipeline/src/wsc_pipeline) is the only thing that writes the
# site: this workflow runs its tests, then its build, then publishes exactly
# what the build produced. Nothing here hand-edits or bypasses that output.
#
# Secrets: TICKETMASTER_API_KEY and TICKETMASTER_AFFILIATE_ID are repo
# secrets Chelsea creates (see docs/LICENSES-AND-ATTRIBUTION.md §6 and the
# pipeline README for the exact `gh secret set` commands). Without
# TICKETMASTER_API_KEY, wsc_pipeline.build still exits 0 and produces a
# valid, deployable site with an explicit "no key configured" notice on
# every page and zero games -- it never errors into an empty/broken site,
# and this workflow still deploys that (honest, if empty) result. A real
# fetch failure (bad key, API outage, non-200 after retries) makes the
# build step fail, and the job stops before Pages is ever touched --
# whatever was last published stays live. That is the "a stale build is
# never published as current" rule in practice: we never relabel an old or
# broken build as today's, we only ever replace a good deploy with another
# good one.
#
# Every action is pinned to a commit, not a tag, per the portfolio's
# security standard -- a tag can move, a pinned SHA cannot.
#
# Requires Pages to be enabled first: Settings > Pages > Source: GitHub
# Actions. Until Chelsea does that, this workflow's build/test steps still
# run and pass; only the deploy step would fail, which is the correct
# report for "not published yet."

name: pages

on:
  schedule:
    # 08:13 UTC nightly (~00:13/01:13 Pacific depending on DST). Not
    # meaningful beyond "once a night, off the hour" -- there is no
    # external deadline this needs to beat.
    - cron: "13 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.9"

jobs:
  build-and-deploy:
    name: build the pipeline output and deploy it to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write # publish the artifact; the only write here, and not to the repo
      id-token: write # deploy-pages authenticates by OIDC rather than a stored secret
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      - name: make install
        run: make install

      # If any check here (including the absence-discipline and
      # duplicate-UID tests) fails, the job stops -- nothing downstream
      # runs, and nothing gets deployed.
      - name: make test
        run: make test

      # A missing TICKETMASTER_API_KEY is handled inside the pipeline
      # itself (degraded mode, exit 0, explicit notice) -- it is not
      # special-cased here. A genuine fetch failure makes this step fail
      # and the job stops before Configure/Upload/Deploy Pages run.
      - name: make build
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TICKETMASTER_AFFILIATE_ID: ${{ secrets.TICKETMASTER_AFFILIATE_ID }}
        run: make build BASE_URL="${{ vars.SITE_BASE_URL || 'https://calendar.chelseakr.com' }}"

      - name: make validate-html
        run: make validate-html

      - name: Print the coverage report to the job summary
        run: cat dist/COVERAGE.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pipeline/dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
