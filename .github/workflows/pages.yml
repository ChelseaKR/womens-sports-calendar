# Nightly build + deploy to GitHub Pages.
#
# The pipeline (pipeline/src/wsc_pipeline) is the only thing that writes the
# site: this workflow runs its tests, then its build, then publishes exactly
# what the build produced. Nothing here hand-edits or bypasses that output.
#
# Secrets: TICKETMASTER_API_KEY and TICKETMASTER_AFFILIATE_ID are repo
# secrets Chelsea creates (see docs/LICENSES-AND-ATTRIBUTION.md §6 and the
# pipeline README for the exact `gh secret set` commands). This workflow
# builds with --require-api-key: without TICKETMASTER_API_KEY the build
# step fails and nothing is deployed. A no-key build fetches nothing, and
# publishing it would replace every subscriber's calendar with an empty
# one -- read by every calendar app as "no games", which is a claim the
# build never checked. (Local and PR CI builds still run in degraded mode;
# its pages say "not fetched", never "no games".) Likewise a real fetch
# failure (bad key, API outage, non-200 after retries) or a build that
# finds zero games across every tracked team makes the build step fail,
# and the job stops before Pages is ever touched -- whatever was last
# published stays live. That is the "a stale build is never published as
# current" rule in practice: we never relabel an old or broken build as
# today's, we only ever replace a good deploy with another good one.
#
# Every action is pinned to a commit, not a tag, per the portfolio's
# security standard -- a tag can move, a pinned SHA cannot.
#
# Requires Pages to be enabled first: Settings > Pages > Source: GitHub
# Actions. Until Chelsea does that, this workflow's build/test steps still
# run and pass; only the deploy step would fail, which is the correct
# report for "not published yet."

name: pages

on:
  schedule:
    # 08:13 UTC nightly (~00:13/01:13 Pacific depending on DST). Not
    # meaningful beyond "once a night, off the hour" -- there is no
    # external deadline this needs to beat.
    - cron: "13 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# Deploys serialize and are never cancelled mid-flight (CI-CD-STANDARD §8b,
# CICD-23): cancelling an in-progress deploy can leave Pages half-promoted.
# The constant group is the §11c "deliberate exception" -- only the newest
# pending run matters for a deploy, and this workflow produces no required
# status check.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  UV_VERSION: "0.12.9"

jobs:
  # Build and deploy are separate jobs so that the job holding the
  # Ticketmaster secrets has no write token and no OIDC identity, and the job
  # that can write to Pages never sees a secret or runs repository code
  # (CI-CD-STANDARD §2, CICD-04). Neither job restores a cache: this build
  # produces the deployed artifact, and cache poisoning would reach
  # production (CI-CD-STANDARD §8c, CICD-24).
  build:
    name: build and validate the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: pipeline
        # bash -eo pipefail instead of the default bash -e (see ci.yml); each
        # step adds -u.
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false

      - name: make install
        run: |
          set -euo pipefail
          make install

      # If any check here (including the absence-discipline and
      # duplicate-UID tests) fails, the job stops -- nothing downstream
      # runs, and nothing gets deployed.
      - name: make test
        run: |
          set -euo pipefail
          make test

      # --require-api-key: a missing TICKETMASTER_API_KEY fails this step
      # instead of producing a degraded, fetched-nothing site. Any fetch
      # failure also fails it. Either way the job stops before the artifact
      # is uploaded and the deploy job never starts. SITE_BASE_URL arrives
      # through env, never interpolated into the script (zizmor
      # template-injection).
      - name: make build
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          TICKETMASTER_AFFILIATE_ID: ${{ secrets.TICKETMASTER_AFFILIATE_ID }}
          SITE_BASE_URL: ${{ vars.SITE_BASE_URL }}
        run: |
          set -euo pipefail
          make build BASE_URL="${SITE_BASE_URL:-https://nexthomegame.com}" BUILD_FLAGS=--require-api-key

      - name: make validate-html
        run: |
          set -euo pipefail
          make validate-html

      # The real, fetched feeds -- the files subscribers' calendar apps
      # re-fetch -- validated before anything is deployed: every linked
      # feed exists, parses, has no duplicate UIDs, and matches its page.
      # A failure stops the job here; the last good deploy stays live.
      - name: make validate-ics
        run: |
          set -euo pipefail
          make validate-ics

      # What search engines read, on the real fetched build: sitemap and
      # robots.txt agree with the pages, every <lastmod> matches the
      # lastmod.json the next build compares against, and every SportsEvent
      # describes a listed game with a known date and time. A failure stops
      # the job here; the last good deploy stays live.
      - name: make validate-seo
        run: |
          set -euo pipefail
          make validate-seo

      - name: Print the coverage report to the job summary
        run: |
          set -euo pipefail
          cat dist/COVERAGE.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the built site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pipeline/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the artifact; the only write here, and not to the repo
      id-token: write # deploy-pages authenticates by OIDC rather than a stored secret
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
