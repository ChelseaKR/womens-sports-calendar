# SEC-19 (Gate 3): a weekly TruffleHog scan of every commit on every branch.
# All three result tiers are reported and any one fails the run: a secret
# that was committed and later revoked comes back `unverified`, and a
# cleaned-up leak is exactly what a history scan exists to find
# (SECURITY-AND-SUPPLY-CHAIN-STANDARD §4). A failed scheduled run notifies
# the owner; treat a hit as an incident (INCIDENT-RESPONSE-STANDARD §4).

name: secret-scan-history

on:
  schedule:
    - cron: "41 5 * * 0" # Sundays 05:41 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  TRUFFLEHOG_VERSION: "3.97.5"
  TRUFFLEHOG_SHA256: "e3d97199c565c37ca6152750197f667e08ae6a1edf5911fbdec168622b28620c"

jobs:
  trufflehog:
    name: trufflehog (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout (all branches, full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install TruffleHog (pinned, checksum-verified)
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/trufflehog.tar.gz"
          curl -fsSL -o "$archive" \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          echo "${TRUFFLEHOG_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" -C "$RUNNER_TEMP" trufflehog

      - name: Scan every commit (verified, unknown and unverified all fail)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/trufflehog" git "file://${GITHUB_WORKSPACE}" \
            --results=verified,unknown,unverified --fail --no-update
