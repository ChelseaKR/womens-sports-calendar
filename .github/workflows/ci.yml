# PR/push gate: tests + a real (degraded, no-secret) build + HTML validation.
# Never touches Pages -- deployment is pages.yml's job, triggered on its own
# schedule and by workflow_dispatch, never by this workflow.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.9"
  NODE_VERSION: "22"

jobs:
  test:
    name: test, build (no secrets), validate HTML, a11y
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: pipeline
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv (Python 3.12)
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: true

      # Node/npm is only needed for `make a11y`'s pa11y-ci step below -- the
      # pipeline itself has no JS dependency. `cache: npm` caches npm's
      # download cache (keyed on pipeline/package-lock.json), so `npm ci` in
      # `make install-a11y` installs pa11y-ci/puppeteer from local tarballs
      # instead of re-downloading them on every run.
      - name: Set up Node (for pa11y)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      # `cache: npm` above only caches npm's own package-download cache --
      # puppeteer (pa11y-ci's browser-automation dependency) separately
      # downloads its own ~150MB+ Chromium binary into ~/.cache/puppeteer
      # via a postinstall script, every time that directory is empty. Keyed
      # on pipeline/package-lock.json, which pins the puppeteer version.
      - name: Cache Puppeteer's Chromium download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('pipeline/package-lock.json') }}

      # `make verify` (install -> test -> build -> validate-html -> a11y) is
      # the same target a human runs locally, so local and CI can't diverge.
      # No TICKETMASTER_API_KEY is available to pull_request runs from a
      # fork by design (GitHub never exposes secrets there), and PR CI has
      # no business hitting the live Discovery API anyway. This exercises
      # the degraded-mode path -- the same path a missing repo secret
      # exercises in production -- and proves the build stays green,
      # produces valid HTML, and passes a real WCAG2AA pa11y check (both
      # the degraded-mode dist/ pages and two fixture pages with a
      # populated games table -- see pipeline/Makefile's `a11y` target).
      - name: make verify
        run: make verify
