[project]
name = "wsc-pipeline"
version = "0.1.0"
description = "Nightly pipeline: Ticketmaster Discovery API -> per-league/team .ics feeds + site data"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "icalendar>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "html5validator>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wsc_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
